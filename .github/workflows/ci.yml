name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-core:
    name: Tests (pinned core deps, scikit-learn fallback)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  test-gnn:
    name: Tests (torch-geometric backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install torch-geometric
      - run: pytest -q
